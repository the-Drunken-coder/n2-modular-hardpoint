name: Viewer deploy and PR previews

# main -> site root; each same-repo PR -> /pr/<n>/. Published from the gh-pages branch.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || '' }}
      LABEL: ${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.pull_request.number, github.event.pull_request.head.ref) || 'main' }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ env.SHA }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: project/cad/requirements.txt}
      - name: Build CI-generated design CAD (project/designs/*/cad/build.py)
        run: |
          ls project/designs/*/cad/build.py >/dev/null 2>&1 || { echo "no generated designs"; exit 0; }
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxft2 libxrender1
          pip install -r project/cad/requirements.txt
          for b in project/designs/*/cad/build.py; do (cd "$(dirname "$b")/.." && python cad/build.py) || echo "::warning::$b failed"; done
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - name: Build viewer
        working-directory: web
        env:
          VITE_BUILD_LABEL: ${{ env.LABEL }}
          VITE_BUILD_SHA: ${{ env.SHA }}
          VITE_SITE_ROOT: ${{ env.TARGET && '../../' || './' }}
        run: npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python tools/ci/pages_publish.py deploy --dist web/dist --target "$TARGET" \
            --label "$LABEL" --title "$TITLE" --sha "$SHA"
      - name: Sticky preview comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/pr/$PR/"
          body="<!-- n2-preview -->"$'\n'"**3D viewer preview:** $url"$'\n\n'"Built from \`${SHA:0:7}\`. Updates on every push; removed when the PR closes."
          python tools/ci/pages_publish.py comment --pr "$PR" --body "$body"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove preview
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python tools/ci/pages_publish.py remove --target "pr/$PR"
          python tools/ci/pages_publish.py comment --pr "$PR" --body $'<!-- n2-preview -->\nPreview removed (PR closed).'
