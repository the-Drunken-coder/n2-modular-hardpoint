name: Status
on:
  push:
    branches: [main, docs/n2-fea-review-rating]
permissions: {contents: write}
jobs:
  status:
    if: "!contains(github.event.head_commit.message, '[status]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 50}
      - run: python site/build_status.py
      - run: |
          git add STATUS.md
          git diff --cached --quiet && exit 0
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git commit -m "chore: regenerate STATUS.md [status]" && git push
