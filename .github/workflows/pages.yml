name: Pages
on:
  push:
    branches: [main, docs/n2-fea-review-rating]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # full history: the site has every CAD revision
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install trimesh manifold3d numpy && python site/build_data.py
      - run: npm ci --legacy-peer-deps && npx vite build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
      - id: d
        uses: actions/deploy-pages@v4
