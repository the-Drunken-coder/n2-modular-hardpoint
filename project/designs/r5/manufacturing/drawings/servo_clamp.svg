<text x="700" y="465" font-size="18" font-weight="bold">Controlled nominal dimensions / finished acceptance</text>
<text x="700" y="490" class="sub">38.6 ×6.8 ×1.6: X41.1–79.7, Y14.6–21.4.</text>
<text x="700" y="512" class="sub">InstalledZ15.9–17.5; servo case topZ15.6.</text>
<text x="700" y="534" class="sub">M2 centersX44.5/76.3, Y18.0; pitch31.8.</text>
<text x="700" y="556" class="sub">HolesØ2.2; countersinksØ4.2 ×1.0 deep.</text>
<text x="700" y="578" class="sub">M2×6 flat-head screws; capturedAF4 nuts.</text>
<text x="700" y="600" class="sub">Upper pad21 ×4 ×0.3 installed.</text>
<text x="700" y="622" class="sub">The clamp avoids relying on unpublished ear holes.</text>
<text x="700" y="644" class="sub">Tighten only to retain the case; do not crush it.</text>
<text x="40" y="792" class="sub">Print flat. Inspect the1.3 mm edge ligament around each countersink mouth.</text>
<text x="40" y="811" class="sub">Set shim thickness using the purchased servo. The22.8 ×12.2 ×28.5 case is a fit reservation.</text>
<text x="40" y="830" class="sub">Measure shaft, supplied horn, screw and wire exit before accepting a purchased actuator.</text>
