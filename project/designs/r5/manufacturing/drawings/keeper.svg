<text x="700" y="465" font-size="18" font-weight="bold">Controlled nominal dimensions / finished acceptance</text>
<text x="700" y="490" class="sub">BarX24.7–60.0874, Y37.2–40.2, Z7.4–10.4.</text>
<text x="700" y="512" class="sub">Bar section3 ×3; nominal vertical float0.6.</text>
<text x="700" y="534" class="sub">YokeX54.5874–65.5874; topZ17.6.</text>
<text x="700" y="556" class="sub">Slot4.4 wide: X57.8874–62.2874; floorZ8.0.</text>
<text x="700" y="578" class="sub">The slot is open at the top; side columns3.3.</text>
<text x="700" y="600" class="sub">M2 stop stud axisX54.5/Z8.9, alongY.</text>
<text x="700" y="622" class="sub">Stop nut pocketAF4.15; load from the−Y side.</text>
<text x="700" y="644" class="sub">Crank radius5.5; angles15–100°; travel6.2677.</text>
<text x="700" y="666" class="sub">Nominal clearance beyond the lug1.4677.</text>
<text x="700" y="688" class="sub">Mechanical limit7.3;105° reserved motion6.7361.</text>
<text x="40" y="792" class="sub">Print the broad Y side flat using the oriented STL. The bar, fork and nut boss stay together.</text>
<text x="40" y="811" class="sub">Insert from+X with the M2 stop stud removed; install the nut and screw afterwards.</text>
<text x="40" y="830" class="sub">Finish sliding surfaces. Verify that receiver guides take the load before the servo follower.</text>
